plugins {
    id 'com.android.library'
    // Without this the module silently compiled to ZERO tests: InstallControllerTest.kt
    // was never built (compileDebugAndroidTestJavaWithJavac NO-SOURCE), and
    // connectedDebugAndroidTest passed VACUOUSLY in 8s with no tests run - run
    // 42455960836. The A->B replacement never executed and only the host-side dumpsys
    // assertion caught it.
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.eightcloud.gallery.installcontroller'
    compileSdk 34

    defaultConfig {
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
