name: VLM test APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build VLM test debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Assemble debug APK
        run: ./gradlew :vlmtest:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vlmtest-debug-apk
          path: vlmtest/build/outputs/apk/debug/vlmtest-debug.apk
