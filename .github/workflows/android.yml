name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;35.0.0
      - name: Restore stable signing key
        env:
          EIGHTCLOUD_KEYSTORE_BASE64: ${{ secrets.EIGHTCLOUD_KEYSTORE_BASE64 }}
          EIGHTCLOUD_KEYSTORE_PASSWORD: ${{ secrets.EIGHTCLOUD_KEYSTORE_PASSWORD }}
          EIGHTCLOUD_KEY_ALIAS: ${{ secrets.EIGHTCLOUD_KEY_ALIAS }}
        run: |
          test -n "$EIGHTCLOUD_KEYSTORE_BASE64" && test -n "$EIGHTCLOUD_KEYSTORE_PASSWORD" && test -n "$EIGHTCLOUD_KEY_ALIAS"
          umask 077
          printf '%s' "$EIGHTCLOUD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/8cloud-signing.p12"
          echo "EIGHTCLOUD_KEYSTORE_PATH=$RUNNER_TEMP/8cloud-signing.p12" >> "$GITHUB_ENV"
          printf 'EIGHTCLOUD_KEYSTORE_PASSWORD=%s\n' "$EIGHTCLOUD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'EIGHTCLOUD_KEY_ALIAS=%s\n' "$EIGHTCLOUD_KEY_ALIAS" >> "$GITHUB_ENV"
      # versionCode is stamped from the run number so every published build is strictly
      # newer than the last - the in-app updater compares versionCode, not versionName.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest -PeightcloudVersionCode=${{ github.run_number }} --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug -PeightcloudVersionCode=${{ github.run_number }} --stacktrace
      - name: Publish-script fixture tests
        run: bash .github/scripts/publish-release-test.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Remove runner signing-key copy
        if: always()
        run: rm -f "$RUNNER_TEMP/8cloud-signing.p12"

  android-test:
    name: App-start smoke test (emulator)
    runs-on: ubuntu-latest
    # Job-level bound: even if a step's own timeout misses, the job cannot hang
    # beyond this (run 42430352606: an unbounded adb in the evidence step blocked
    # on a dead emulator for 69 minutes).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable signing key
        env:
          EIGHTCLOUD_KEYSTORE_BASE64: ${{ secrets.EIGHTCLOUD_KEYSTORE_BASE64 }}
          EIGHTCLOUD_KEYSTORE_PASSWORD: ${{ secrets.EIGHTCLOUD_KEYSTORE_PASSWORD }}
          EIGHTCLOUD_KEY_ALIAS: ${{ secrets.EIGHTCLOUD_KEY_ALIAS }}
        run: |
          test -n "$EIGHTCLOUD_KEYSTORE_BASE64" && test -n "$EIGHTCLOUD_KEYSTORE_PASSWORD" && test -n "$EIGHTCLOUD_KEY_ALIAS"
          umask 077
          printf '%s' "$EIGHTCLOUD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/8cloud-signing.p12"
          echo "EIGHTCLOUD_KEYSTORE_PATH=$RUNNER_TEMP/8cloud-signing.p12" >> "$GITHUB_ENV"
          printf 'EIGHTCLOUD_KEYSTORE_PASSWORD=%s\n' "$EIGHTCLOUD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'EIGHTCLOUD_KEY_ALIAS=%s\n' "$EIGHTCLOUD_KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Stage A->B update fixture APKs + manifests
        run: |
          set -euo pipefail
          FIX=srv/update-fixtures
          mkdir -p "$FIX"
          # Candidate B: versionCode 3, stable key (the update the test installs).
          ./gradlew assembleDebug -PeightcloudVersionCode=3 --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$FIX/b.apk"
          # Candidate C: same bytes re-signed with a throwaway key - must be rejected.
          keytool -genkeypair -alias throwaway -keyalg RSA -keysize 2048 -validity 365 \
            -keystore "$RUNNER_TEMP/throwaway.p12" -storetype PKCS12 \
            -storepass throwaway-pass -keypass throwaway-pass -dname "CN=throwaway"
          cp "$FIX/b.apk" "$FIX/c.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/throwaway.p12" \
            --ks-pass pass:throwaway-pass --key-pass pass:throwaway-pass "$FIX/c.apk"
          rm -f "$RUNNER_TEMP/throwaway.p12"
          # Static release manifests, served by the host-side fixture server below.
          # The guest never binds a socket (CI emulator refuses ServerSocket with EPERM).
          BASE=http://127.0.0.1:8799
          B_SHA=$(sha256sum "$FIX/b.apk" | cut -d' ' -f1)
          C_SHA=$(sha256sum "$FIX/c.apk" | cut -d' ' -f1)
          BAD_SHA=$(printf '0%.0s' $(seq 64))
          for s in good badsha old wrongsig; do
            printf '{"assets":[{"name":"8cloud-update.json","browser_download_url":"%s/manifest-%s.json"}]}' \
              "$BASE" "$s" > "$FIX/release-$s.json"
          done
          printf '{"versionCode":3,"versionName":"0.15.0","apkUrl":"%s/b.apk","sha256":"%s"}' "$BASE" "$B_SHA" > "$FIX/manifest-good.json"
          printf '{"versionCode":3,"versionName":"0.15.0","apkUrl":"%s/b.apk","sha256":"%s"}' "$BASE" "$BAD_SHA" > "$FIX/manifest-badsha.json"
          printf '{"versionCode":2,"versionName":"0.15.0","apkUrl":"%s/b.apk","sha256":"%s"}' "$BASE" "$B_SHA" > "$FIX/manifest-old.json"
          printf '{"versionCode":3,"versionName":"0.15.0","apkUrl":"%s/c.apk","sha256":"%s"}' "$BASE" "$C_SHA" > "$FIX/manifest-wrongsig.json"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        # Hard envelope: a hung instrumentation (e.g. after the A->B install replaces the
        # app under test) must fail the step so the evidence steps below still run,
        # instead of blocking the job forever.
        timeout-minutes: 30
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          # Fixture A installs at versionCode 2; the controller drives B (3) over it.
          # The fixtures are served from the HOST; adb reverse bridges the emulator's
          # loopback to it, so the guest never binds a socket (EPERM on this emulator).
          # One line, one shell: the runner executes each script line as its own sh -c,
          # so background servers/$!/traps only work inside a committed script file.
          script: |
            bash .github/scripts/run-update-tests.sh
      - name: Pull update-flow evidence
        if: always()
        # Bounded + device-scoped: without -s and a timeout, a missing/dead
        # emulator makes `adb logcat` wait for a device forever.
        timeout-minutes: 3
        run: |
          mkdir -p update-evidence
          for f in $(timeout 30 adb -s emulator-5554 shell 'ls /data/local/tmp/uf-* 2>/dev/null' | tr -d '\r'); do
            case "$f" in /data/local/tmp/uf-*) ;; *) continue;; esac
            timeout 30 adb -s emulator-5554 pull "$f" update-evidence/ || true
          done
          for f in $(timeout 30 adb -s emulator-5554 exec-out run-as app.eightcloud.gallery.debug ls files/update-evidence/ 2>/dev/null | tr -d '\r'); do
            case "$f" in *:*|*/*|"") continue;; esac
            timeout 30 adb -s emulator-5554 exec-out run-as app.eightcloud.gallery.debug cat "files/update-evidence/$f" > "update-evidence/$f" 2>/dev/null || true
          done
          timeout 60 adb -s emulator-5554 logcat -d > update-evidence/logcat-pull.txt 2>/dev/null || true
          [ -s update-evidence/logcat-pull.txt ] || rm -f update-evidence/logcat-pull.txt
          ls -la update-evidence/ || true
          find update-evidence -name '*:*' -delete
          # Console redundancy: if artifact upload fails again the evidence survives in the run log.
          echo '== logcat-uftrace.txt =='; cat update-evidence/logcat-uftrace.txt 2>/dev/null || true
          for t in update-evidence/trace-*.txt; do [ -f "$t" ] && { echo "== $t =="; cat "$t"; }; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-flow-evidence
          path: update-evidence/
      - name: Remove runner signing-key copy
        if: always()
        run: rm -f "$RUNNER_TEMP/8cloud-signing.p12"

  publish:
    name: Publish release
    # Gated automatic release on the exact main head. Merging to main still requires
    # the user's explicit OK (standing rule); this job only runs after such a merge.
    # Dispatch runs never publish. Nothing is ever deleted or overwritten: existing
    # releases/assets are preserved (see .github/scripts/publish-release.sh gates).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, android-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_CHECK_NAME: Build debug APK + unit tests
      EXPECTED_CERT_SHA256: 501ffd102c711f96d8c3e196225167f14b58276c6e7fb462b58f301b2cc493e1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;35.0.0
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk
      - name: Gate and publish
        run: bash .github/scripts/publish-release.sh apk/app-debug.apk
