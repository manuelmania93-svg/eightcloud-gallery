name: VLM test APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build VLM test debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Assemble debug APK
        run: ./gradlew :vlmtest:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vlmtest-debug-apk
          path: vlmtest/build/outputs/apk/debug/vlmtest-debug.apk

  layout-check:
    name: Layout screenshot (emulator)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vlmtest-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshot on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/vlmtest-debug.apk
            adb shell wm size 1116x2480
            adb shell wm density 440
            sleep 3
            adb shell am start -n app.eightcloud.vlmtest/app.eightcloud.vlmtest.MainActivity --ez demo true
            sleep 8
            adb exec-out screencap -p > shot1.png
            adb shell settings put system font_scale 1.3
            adb shell wm density 480
            sleep 3
            adb shell am force-stop app.eightcloud.vlmtest
            adb shell am start -n app.eightcloud.vlmtest/app.eightcloud.vlmtest.MainActivity --ez demo true
            sleep 8
            adb exec-out screencap -p > shot2.png
      - uses: actions/upload-artifact@v4
        with:
          name: layout-shots
          path: shot*.png
