plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.eightcloud.gallery'
    compileSdk 34

    defaultConfig {
        applicationId "app.eightcloud.gallery"
        minSdk 26
        targetSdk 34
        // CI stamps versionCode from the Actions run number (-PeightcloudVersionCode=N)
        // so every published build is strictly newer - the in-app updater compares
        // versionCode, not versionName. max() with the source floor matters: if CI run
        // numbering ever resets (workflow recreated, repo forked), raising this floor
        // above the last published versionCode keeps updates flowing instead of stalling
        // below the installed base (installed builds up to v0.14.1-m2-pre carry code 1).
        def stampedVersionCode = (project.findProperty('eightcloudVersionCode') ?: '0') as int
        versionCode Math.max(stampedVersionCode, 2)
        // Semantic version. Every merge intended to produce a release bumps this (minor
        // for features, patch for fixes); the publish job skips cleanly when the tag
        // exists, so merges without a bump intentionally publish nothing.
        versionName "0.15.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (System.getenv("EIGHTCLOUD_KEYSTORE_PATH")) {
            stable {
                storeFile file(System.getenv("EIGHTCLOUD_KEYSTORE_PATH"))
                storePassword System.getenv("EIGHTCLOUD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("EIGHTCLOUD_KEY_ALIAS")
                keyPassword System.getenv("EIGHTCLOUD_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            // When CI restores the stable key, the debug variant (the shipped package
            // app.eightcloud.gallery.debug) is signed with it; local builds keep the
            // per-machine debug key.
            if (System.getenv("EIGHTCLOUD_KEYSTORE_PATH")) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json on the JVM so the update-manifest parser is unit-testable.
    testImplementation 'org.json:json:20240303'

    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
